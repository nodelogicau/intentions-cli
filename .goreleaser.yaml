version: 2

project_name: intentions

before:
  hooks:
    - go mod tidy

builds:
  - id: intentions
    main: ./cmd/intentions
    binary: intentions
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nodelogicau/intentions-cli/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# Darwin universal binary for the Desktop bundle (MCPB platform overrides are
# keyed by OS, not arch). The per-arch archives are unaffected.
universal_binaries:
  - id: intentions-universal
    ids: [intentions]
    replace: false
    name_template: intentions
    hooks:
      post: sh scripts/build-bundle.sh {{ .Version }} dist

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/*.mcpb

# Homebrew cask (macOS), published to the same tap as particulars. `brews`
# was removed in GoReleaser 2.16; casks are the supported way to ship a
# pre-built binary.
homebrew_casks:
  - name: intentions
    repository:
      owner: nodelogicau
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/nodelogicau/intentions-cli
    description: Write and check Intentions Format workspaces from the command line
    license: MIT
    skip_upload: auto
    commit_author:
      name: intentions-release
      email: noreply@nodelogic.au
    url:
      verified: github.com/nodelogicau/intentions-cli/
    binaries:
      - intentions
    # Homebrew deprecated `postflight`, which hooks.post.install generates,
    # for the declarative `postflight_steps`. The block is a Go template, so
    # Homebrew's own {{staged_path}} placeholder is escaped to pass through.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/intentions"]
        end
      end

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: dist/*.mcpb
